    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
      @media print {
        body * {
          visibility: hidden;
        }
        #receipt-modal-content, #receipt-modal-content *,
        #report-modal-content, #report-modal-content * {
          visibility: visible;
        }
        #receipt-modal-content, #report-modal-content {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: auto;
          border: none;
          box-shadow: none;
          color: black !important;
          background: white !important;
          overflow: visible !important;
        }
        .no-print {
          display: none;
        }
      }
    </style>
